const KS='tr31_lock_k';
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const tob64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
function inject(html){const doc=new DOMParser().parseFromString(html,'text/html');document.title=doc.title;doc.head.querySelectorAll('style').forEach(st=>document.head.appendChild(st.cloneNode(true)));const scripts=[...doc.body.querySelectorAll('script')].map(x=>x.textContent);doc.body.querySelectorAll('script').forEach(x=>x.remove());document.body.innerHTML=doc.body.innerHTML;scripts.forEach(code=>{const el=document.createElement('script');el.textContent=code;document.body.appendChild(el);});}
try{navigator.serviceWorker&&navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.update()))}catch(x){}
async function unlock(key){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.iv)},key,u8(D.ct));inject(new TextDecoder().decode(pt));}
async function fromPw(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.salt),iterations:D.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);}
function showForm(){document.getElementById('box').style.display='block';document.getElementById('pw').focus();}
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const err=document.getElementById('err');err.textContent='確認しています…';
 let key;try{key=await fromPw(document.getElementById('pw').value);await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.iv)},key,u8(D.ct));}catch(x){err.textContent='パスワードが違います';return}
 try{localStorage.setItem(KS,tob64(await crypto.subtle.exportKey('raw',key)))}catch(x){}
 await unlock(key);});
(async()=>{let raw=null;try{raw=localStorage.getItem(KS)}catch(x){}
 if(raw){try{const key=await crypto.subtle.importKey('raw',u8(raw),{name:'AES-GCM'},false,['decrypt']);await unlock(key);return}catch(x){try{localStorage.removeItem(KS)}catch(y){}}}
 showForm();})();
})();
